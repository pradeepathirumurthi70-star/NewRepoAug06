#Workflow Name - Test
name : First Workflow

#Trigger
on :
  push: 
  workflow_dispatch:  #manual

jobs:
  #First Job
  Hello-job:
    #runner - GitHub hosted
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello World"
      - name: Event Name
        run: echo "Event Name :${{github.event_name}}"

  #Second job
  echo-goodbye: 
    needs: Hello-job
    runs-on: ubuntu-slim
    steps:
      - name: Say GoodBye
        run: echo "GoodBye"
      #Multiple commands
      - name: Multi-Line Bash
        run: |
          echo "I am"
          echo "Multi -Line"
          echo "Script"
          
  #Third Job
  Windows-echo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Show OS
        shell: bash
        run: echo "The Job is running on windows runner."
      
